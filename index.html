<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="담임·전담교사를 위한 교실 발표 방법 도감과 진행 도우미">
<title>발표나침반</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface2:#F6F8F6; --ink:#1B2A24; --muted:#5B6B64; --line:#D5DDD8;
  --accent:#1E6A50; --accent-ink:#FFFFFF; --accent-soft:#DCEDE5; --hi:#E9B620; --hi-soft:#FBF0CC; --danger:#C2463D;
  --c-pick:#B4552B; --c-all:#1E6A50; --c-low:#3D6FA8; --c-group:#7A4FA0; --c-discuss:#A0405F; --c-act:#8A6A12; --c-formal:#44545D;
  --board:#173A2F; --board2:#1E4638; --chalk:#F2F0E6; --chalk-dim:#A9C0B5; --chalk-hi:#F5CF4E;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101714; --surface:#17211D; --surface2:#1C2823; --ink:#E6EEE9; --muted:#97A8A0; --line:#2B3A34;
    --accent:#4FB58E; --accent-ink:#0B1511; --accent-soft:#1D3A2F; --hi:#F2C94C; --hi-soft:#3A3219; --danger:#E0736A;
    --c-pick:#E08A5E; --c-all:#4FB58E; --c-low:#7FA9DC; --c-group:#B592D6; --c-discuss:#DB7C9C; --c-act:#D5B04E; --c-formal:#9DB0BA;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101714; --surface:#17211D; --surface2:#1C2823; --ink:#E6EEE9; --muted:#97A8A0; --line:#2B3A34;
  --accent:#4FB58E; --accent-ink:#0B1511; --accent-soft:#1D3A2F; --hi:#F2C94C; --hi-soft:#3A3219; --danger:#E0736A;
  --c-pick:#E08A5E; --c-all:#4FB58E; --c-low:#7FA9DC; --c-group:#B592D6; --c-discuss:#DB7C9C; --c-act:#D5B04E; --c-formal:#9DB0BA;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
.app{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 10px}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-family:var(--display);font-weight:400;font-size:28px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:13px}
.mark{width:44px;height:44px;flex:none}
.classpick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tabs button{background:none;border:0;padding:12px 16px;font-family:var(--display);font-size:19px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--hi)}

/* generic */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{padding:12px 20px;font-size:17px}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}

/* catalog */
.filters{display:grid;gap:12px;margin-bottom:18px}
.filters .search{width:100%;font-size:16px;padding:11px 14px}
.frow{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.frow .label{width:64px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px;position:relative}
.card:hover{border-color:var(--accent)}
.card h3{font-size:21px;line-height:1.25}
.card p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cat{font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--cc)}
.cat::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--cc);margin-right:6px;vertical-align:1px}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:auto;padding-top:6px;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums}
.dots{letter-spacing:1px;color:var(--hi)}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--hi-soft);color:var(--ink)}
.count{font-size:13px;color:var(--muted);margin:0 0 10px}
.recipes{margin-bottom:18px}
.recipes .list{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.rcp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 6px 6px 12px}
.rcp small{color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,16,.55);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 16px}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;max-width:720px;width:100%;padding:24px;position:relative;margin-block:auto}
.x{position:absolute;right:12px;top:12px;border:0;background:var(--surface2);border-radius:8px;width:36px;height:36px;font-size:18px}
.sheet h2{font-size:32px;line-height:1.15;padding-right:40px}
.steps{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:start;padding:10px 12px;background:var(--surface2);border-radius:8px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--display);font-size:20px;color:var(--accent);line-height:1.3}
.steps .t{font-weight:700}
.steps .d{display:block;color:var(--muted);font-size:14px;font-weight:400}
.steps .sec{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);white-space:nowrap}
.loopmark{font-size:11px;font-weight:700;color:var(--c-group);margin-left:6px}
.tip{background:var(--hi-soft);border-radius:8px;padding:10px 14px;font-size:14px;margin:10px 0}
.src a{color:var(--accent)}

/* config */
.cfg-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cfg-row .t{font-weight:500}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-size:18px;line-height:1}
.stepper input{width:74px;text-align:center;font-variant-numeric:tabular-nums;font-size:17px;padding:6px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0;padding:12px 14px;background:var(--accent-soft);border-radius:8px}
.total b{font-family:var(--display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:8px;margin:10px 0 16px}
.opts label{display:flex;gap:8px;align-items:center}
.sub{font-size:12px;color:var(--muted)}

/* board */
#board{position:fixed;inset:0;z-index:60;background:var(--board);color:var(--chalk);display:grid;grid-template-rows:auto 1fr auto;
  background-image:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.06),transparent 55%),radial-gradient(ellipse at 90% 90%,rgba(0,0,0,.25),transparent 60%);
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(env(safe-area-inset-bottom,0px) + 14px)}
#board .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#board .bname{font-family:var(--display);font-size:24px}
#board .bpos{color:var(--chalk-dim);font-variant-numeric:tabular-nums}
.bbtn{background:rgba(255,255,255,.08);color:var(--chalk);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:10px 16px;font-size:16px}
.bbtn:hover{background:rgba(255,255,255,.16)}
.bbtn.main{background:var(--chalk-hi);color:#1B2A24;border-color:var(--chalk-hi);font-weight:700;min-width:120px}
.bmain{display:grid;grid-template-columns:1fr 260px;gap:24px;min-height:0}
.bcenter{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;min-width:0}
.round{font-family:var(--display);font-size:22px;color:var(--chalk-hi);min-height:1.3em}
.btitle{font-family:var(--display);font-size:clamp(36px,6vw,76px);line-height:1.1;text-wrap:balance}
.bdesc{font-size:clamp(16px,2vw,24px);color:var(--chalk-dim);max-width:40ch;min-height:1.5em}
.clock{font-family:var(--display);font-size:clamp(88px,20vw,230px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em;transition:color .3s}
.clock.warn{color:var(--chalk-hi)}
.clock.over{color:#FF8F7D;animation:blink 1s steps(2) infinite}
.clock.manual{font-size:clamp(32px,5vw,56px);color:var(--chalk-dim)}
@keyframes blink{50%{opacity:.35}}
.pbar{width:min(640px,90%);height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--chalk-hi);width:0;transition:width .25s linear}
.rail{list-style:none;margin:0;padding:12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;background:rgba(0,0,0,.15);border-radius:12px}
.rail li{padding:6px 10px;border-radius:6px;font-size:14px;color:var(--chalk-dim);display:flex;justify-content:space-between;gap:8px}
.rail li.on{background:rgba(245,207,78,.18);color:var(--chalk)}
.rail li.done{opacity:.45;text-decoration:line-through}
.rail span{font-variant-numeric:tabular-nums}
.bctrl{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;align-items:center}
.bnext{color:var(--chalk-dim);font-size:15px;text-align:center;margin-bottom:8px}
.bpick{position:absolute;inset:0;background:rgba(10,30,22,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.bpick .who{font-family:var(--display);font-size:clamp(64px,14vw,160px);color:var(--chalk-hi);line-height:1}
@media (max-width:760px){.bmain{grid-template-columns:1fr}.rail{display:none}}

/* tools */
.toolnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.toolnav button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px}
.toolnav button b{display:block;font-family:var(--display);font-weight:400;font-size:18px}
.toolnav button span{font-size:12px;color:var(--muted)}
.toolnav button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.stage{background:var(--board);color:var(--chalk);border-radius:14px;padding:28px 20px;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;position:relative}
.stage .hint{color:var(--chalk-dim);font-size:15px;max-width:52ch}
.stage .huge{font-family:var(--display);font-size:clamp(56px,11vw,130px);line-height:1.05;color:var(--chalk-hi)}
.stage .mid{font-family:var(--display);font-size:clamp(28px,5vw,48px);line-height:1.2}
.stage select,.stage input{background:rgba(255,255,255,.08);color:var(--chalk);border-color:rgba(255,255,255,.2)}
.stage label{color:var(--chalk-dim);font-size:14px;display:flex;gap:6px;align-items:center}
.stage option{color:#1B2A24}
.shake{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translateX(-2px)}50%{transform:translateX(2px)}100%{transform:translateX(-2px)}}
.beats{display:flex;gap:14px}
.beats i{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.3);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:16px;color:var(--chalk-dim)}
.beats i.clap{border-color:var(--chalk-hi)}
.beats i.on{background:var(--chalk-hi);color:#1B2A24}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;width:100%;max-width:820px}
.namegrid button{background:rgba(255,255,255,.07);color:var(--chalk);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 4px;font-size:15px}
.namegrid button.used{opacity:.35}
.chain{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:820px;font-size:15px}
.chain span{background:rgba(245,207,78,.15);border-radius:6px;padding:3px 8px}
.chain em{color:var(--chalk-dim);font-style:normal}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;width:100%;max-width:900px;text-align:left}
.groups div{background:rgba(255,255,255,.07);border-radius:10px;padding:10px 12px}
.groups b{font-family:var(--display);font-weight:400;color:var(--chalk-hi);font-size:20px;display:block}
.passq{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.passq span{border:1px dashed var(--chalk-dim);border-radius:6px;padding:2px 8px;font-size:14px;color:var(--chalk-dim)}
.coach{margin-top:20px}
.coach h3{font-size:22px;margin-bottom:8px}
.coach ul{margin:0;padding-left:18px;display:grid;gap:6px}

/* class */
.classgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px}
@media (max-width:760px){.classgrid{grid-template-columns:1fr}}
.classgrid textarea{width:100%;min-height:260px;resize:vertical}
.bars{display:grid;gap:4px;max-height:520px;overflow-y:auto}
.bars .b{display:grid;grid-template-columns:72px 1fr 34px;gap:8px;align-items:center;font-size:14px}
.bars .track{height:14px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bars .track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bars .zero{color:var(--danger);font-weight:700}
.bars .n{text-align:right;font-variant-numeric:tabular-nums}
.summary{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.summary div b{font-family:var(--display);font-weight:400;font-size:30px;display:block;line-height:1}
.confirm{background:var(--hi-soft);padding:10px 12px;border-radius:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* recommend */
.q{margin-bottom:18px}
.q h3{font-size:20px;margin-bottom:8px}
.rec-out{display:grid;gap:10px;margin-top:10px}
.rec-item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.rec-item .rank{font-family:var(--display);font-size:34px;color:var(--hi);line-height:1}
.rec-item h3{font-size:22px}
.rec-item p{margin:0;font-size:14px;color:var(--muted)}
@media (max-width:560px){.rec-item{grid-template-columns:34px 1fr}.rec-item .row{grid-column:1/-1}}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="var(--accent)"/><circle cx="22" cy="22" r="15" fill="none" stroke="var(--accent-ink)" stroke-opacity=".35" stroke-width="1.5"/><path d="M22 7 L27 22 L22 37 L17 22 Z" fill="var(--accent-ink)"/><path d="M22 7 L27 22 L17 22 Z" fill="var(--hi)"/><circle cx="22" cy="22" r="2.4" fill="var(--accent)"/></svg>
      <div><b>발표나침반</b><small>교실 발표 방법 도감 · 진행 도우미 (프로토타입)</small></div>
    </div>
    <label class="classpick" for="classSel">지금 수업하는 반 <select id="classSel"></select></label>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="catalog" aria-selected="true">발표 방법 도감</button>
    <button role="tab" data-tab="recommend" aria-selected="false">추천받기</button>
    <button role="tab" data-tab="tools" aria-selected="false">발표자 정하기 도구</button>
    <button role="tab" data-tab="class" aria-selected="false">우리 반 기록</button>
  </nav>
  <main>
    <section id="v-catalog"></section>
    <section id="v-recommend" hidden></section>
    <section id="v-tools" hidden></section>
    <section id="v-class" hidden></section>
  </main>
</div>

<div id="modal" class="modal" hidden><div class="sheet" role="dialog" aria-modal="true"><button class="x" data-act="close" aria-label="닫기">✕</button><div id="modalBody"></div></div></div>

<div id="board" hidden>
  <div class="bar">
    <div><div class="bname" id="bName"></div><div class="bpos" id="bPos"></div></div>
    <div class="row"><button class="bbtn" data-act="bpick">발표자 뽑기</button><button class="bbtn" data-act="bfull">전체 화면</button><button class="bbtn" data-act="bclose">끝내기 ✕</button></div>
  </div>
  <div class="bmain">
    <div class="bcenter">
      <div class="round" id="bRound"></div>
      <div class="btitle" id="bTitle"></div>
      <div class="bdesc" id="bDesc"></div>
      <div class="clock" id="bClock">0:00</div>
      <div class="pbar"><i id="bBar"></i></div>
    </div>
    <ol class="rail" id="bRail"></ol>
  </div>
  <div>
    <div class="bnext" id="bNext"></div>
    <div class="bctrl">
      <button class="bbtn" data-act="bprev">◀ 이전</button>
      <button class="bbtn" data-act="bminus">−30초</button>
      <button class="bbtn main" data-act="bpause" id="bPause">일시정지</button>
      <button class="bbtn" data-act="bplus">+1분</button>
      <button class="bbtn" data-act="bnext">다음 ▶</button>
    </div>
  </div>
  <div class="bpick" id="bPickLayer" hidden></div>
</div>
<div id="toast" role="status"></div>

<script>
/* ---------- 출처 ---------- */
const SRC={
  c:{name:'citrusy97 블로그 · 눈치게임 발표',url:'https://blog.naver.com/citrusy97/224332741215'},
  u:{name:'urimilssam 블로그 · 수업 친구 모임',url:'https://blog.naver.com/urimilssam/224217182273'},
  t:{name:'teacher0325 블로그 · 재밌는 발표 시간',url:'https://blog.naver.com/teacher0325/221499339498'}

function tone(f,d,type='sine',v=.25,w=0){const a=audio();if(!a)return;const t=a.currentTime+w,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d)}

/* ---------- 진행 설정 ---------- */
function buildSeq(m,rounds,secs){
  const st=m.steps.map((s,i)=>({title:s[0],desc:s[2]||'',sec:secs?secs[i]:s[1],loop:s[3]||0,i}));
  const first=st.findIndex(s=>s.loop),hasLoop=first>=0;
  if(!hasLoop)return st.map(s=>({...s,round:0}));
  let last=st.length-1;while(!st[last].loop)last--;
  const pre=st.slice(0,first),loop=st.slice(first,last+1),post=st.slice(last+1),out=pre.map(s=>({...s,round:0}));
  for(let r=1;r<=rounds;r++)loop.forEach(s=>{if(s.loop===2&&r===rounds)return;out.push({...s,round:r})});
  return out.concat(post.map(s=>({...s,round:0})));
}

  document.querySelectorAll('.secin').forEach(inp=>inp.onchange=()=>{cfg.secs[+inp.dataset.i]=Math.min(5940,parseTime(inp.value));inp.value=fmt(cfg.secs[+inp.dataset.i]);updTotal()});

let run=null,ticker=null,wake=null;
function startRun(c){const m=byId[c.mid];audio();
  run={cfg:c,m,seq:buildSeq(m,c.rounds,c.secs),i:0};closeModal();$('#board').hidden=false;
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}
  $('#bName').textContent=m.name;goStep(0);clearInterval(ticker);ticker=setInterval(tick,200)}
function goStep(i){if(!run)return;run.i=Math.max(0,Math.min(run.seq.length-1,i));const s=run.seq[run.i];
  run.done=false;run.warned=false;run.paused=false;run.total=s.sec*1000;run.remain=run.total;run.endAt=Date.now()+run.remain;clearTimeout(run.nt);drawBoard()}
function drawBoard(){const s=run.seq[run.i],n=run.seq[run.i+1];
  $('#bPos').textContent=`${run.i+1} / ${run.seq.length} 단계`;
  $('#bRound').textContent=s.round?`라운드 ${s.round} / ${run.cfg.rounds}`:'';
  $('#bTitle').textContent=s.title;$('#bDesc').textContent=s.desc;
  $('#bNext').textContent=n?`다음: ${n.title}${n.round?` (라운드 ${n.round})`:''}${n.sec?` · ${fmt(n.sec)}`:''}`:'마지막 단계예요';
  $('#bPause').textContent=s.sec?(run.paused?'계속 ▶':'일시정지'):'다음 단계 ▶';
  $('#bRail').innerHTML=run.seq.map((x,j)=>`<li class="${j===run.i?'on':j<run.i?'done':''}"><span>${esc(x.title)}${x.round?` · ${x.round}`:''}</span><span>${x.sec?fmt(x.sec):'수동'}</span></li>`).join('');
  const on=$('#bRail .on');on&&on.scrollIntoView({block:'nearest'});drawClock()}
function drawClock(){const s=run.seq[run.i],c=$('#bClock');
  if(!s.sec){c.textContent='준비되면 다음으로';c.className='clock manual';$('#bBar').style.width='0';return}
  c.textContent=run.done?'시간 끝!':fmt(Math.ceil(run.remain/1000));
  c.className='clock'+(run.done?' over':run.remain<=30000?' warn':'');
  $('#bBar').style.width=Math.min(100,100*(1-run.remain/run.total))+'%'}
function tick(){if(!run)return;const s=run.seq[run.i];if(!s.sec||run.paused||run.done)return;
  run.remain=run.endAt-Date.now();
  if(run.cfg.warn&&!run.warned&&run.remain<=30000&&run.total>45000){run.warned=true;warnBeep()}
  if(run.remain<=0){run.remain=0;run.done=true;SOUNDS[run.cfg.sound]();
    if(run.cfg.autoNext&&run.i<run.seq.length-1)run.nt=setTimeout(()=>goStep(run.i+1),1800)}
  drawClock()}
function togglePause(){const s=run.seq[run.i];if(!s.sec){goStep(run.i+1);return}
  if(run.done){goStep(run.i+1);return}
  run.paused=!run.paused;if(!run.paused)run.endAt=Date.now()+run.remain;drawBoard()}
function addTime(ms){const s=run.seq[run.i];if(!s.sec)return;
  run.remain=Math.max(1000,run.remain+ms);if(run.done){run.done=false;clearTimeout(run.nt)}run.total=Math.max(run.total,run.remain);run.endAt=Date.now()+run.remain;if(run.remain>30000)run.warned=false;drawClock()}
function closeBoard(){clearInterval(ticker);if(run)clearTimeout(run.nt);run=null;$('#board').hidden=true;$('#bPickLayer').hidden=true;try{wake&&wake.release()}catch(e){}wake=null;try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}

function fairPick(fair){const c=cur();let pool=c.students.filter(n=>!fair||!sessionPicked.has(n));if(!pool.length){sessionPicked.clear();pool=[...c.students]}
  if(!fair)return rand(pool);
  const w=pool.map(n=>1/Math.pow(1+(c.counts[n]||0),2));let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i]}return pool[pool.length-1]}

  </div>
  <div class="panel"><span class="label">발표 기록</span>
    <div class="summary" style="margin-top:8px"><div><b>${total}</b><span class="small muted">총 발표</span></div><div><b style="color:var(--danger)">${zero}</b><span class="small muted">아직 0회</span></div><div><b>${c.students.length?(total/c.students.length).toFixed(1):0}</b><span class="small muted">1인 평균</span></div></div>
    <p class="small muted" style="margin-top:0">적게 발표한 친구가 위에 있어요. 도구에서 “발표함”을 누르면 쌓여요.</p>
    <div class="bars">${sorted.map(([n,k])=>`<div class="b"><span class="${k?'':'zero'}">${esc(n)}</span><span class="track"><i style="width:${100*k/max}%"></i></span><span class="n">${k}</span></div>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" data-act="askReset">기록 초기화</button></div>
    ${confirmAct==='reset'?`<div class="confirm">발표 기록을 모두 지울까요? <button class="btn danger" data-act="resetCounts">지우기</button><button class="btn" data-act="noConfirm">취소</button></div>`:''}
  </div></div>`}

/* ---------- 이벤트 ---------- */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
$('#classSel').onchange=e=>{curId=e.target.value;save();T.pass=null;T.relay=[];T.groups=null;sessionPicked.clear();render();toast(cur().name+'(으)로 바꿨어요')};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#bPickLayer').hidden)$('#bPickLayer').hidden=true;else if(run)return;else closeModal()}
  if(run&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){if(e.key===' '){e.preventDefault();togglePause()}if(e.key==='ArrowRight')goStep(run.i+1);if(e.key==='ArrowLeft')goStep(run.i-1)}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset;
  switch(a){
  case 'close':closeModal();break;
  case 'f':F[d.k]=d.k==='burden'?+d.v:(F[d.k]===d.v?'':d.v);renderCatalog();break;
  case 'open':openDetail(d.id);break;
  case 'config':openConfig(d.id);break;
  case 'gotool':closeModal();tool=d.tool;showTab('tools');break;
  case 'rnd':cfg.rounds=Math.max(1,Math.min(12,cfg.rounds+ +d.d));$('#cfg-rounds').value=cfg.rounds;updTotal();break;
  case 'sec':{const i=+d.i;cfg.secs[i]=Math.max(0,Math.min(5940,cfg.secs[i]+ +d.d));$('#cfg-s'+i).value=fmt(cfg.secs[i]);updTotal();break}
  case 'try':audio();SOUNDS[cfg.sound]();break;
  case 'resetcfg':openConfig(cfg.mid);break;
  case 'start':startRun({...cfg});break;
  case 'saveRecipe':{const nm=$('#cfg-name').value.trim()||`${byId[cfg.mid].name} ${cfg.rounds>1?cfg.rounds+'라운드':''}`.trim();recipes=[...recipes,{...cfg,secs:[...cfg.secs],id:'r'+Date.now(),name:nm}];save();toast('레시피 “'+nm+'” 저장');break}
  case 'runRecipe':{const r=recipes.find(x=>x.id===d.id);r&&openConfig(r.mid,r);break}
  case 'delRecipe':recipes=recipes.filter(x=>x.id!==d.id);save();renderCatalog();break;
  case 'bclose':closeBoard();break;
  case 'bpause':togglePause();break;
  case 'bnext':goStep(run.i+1);break;
  case 'bprev':goStep(run.i-1);break;
  case 'bplus':addTime(60000);break;
  case 'bminus':addTime(-30000);break;
  case 'bfull':try{document.fullscreenElement?document.exitFullscreen():$('#board').requestFullscreen().catch(()=>toast('이 화면에서는 전체 화면을 쓸 수 없어요'))}catch(err){toast('이 화면에서는 전체 화면을 쓸 수 없어요')}break;
  case 'bpick':boardPick();break;
  case 'bpRec':recordTalk(d.n);$('#bPickLayer').hidden=true;break;
  case 'bpClose':$('#bPickLayer').hidden=true;break;
  case 'tool':tool=d.tool;renderTools();break;
  case 'doPick':audio();animatePick($('#pickOut'),T.fair,T.wait,who=>{$('#pickOut').innerHTML=`<div class="huge">${esc(who)}</div><div class="row" style="justify-content:center;margin-top:12px"><button class="bbtn main" data-act="rec" data-n="${esc(who)}">발표함 ✓ 기록</button></div>`});break;
  case 'rec':recordTalk(d.n);b.disabled=true;b.textContent='기록했어요';break;
  case 'doRps':{audio();const o=$('#rpsOut');const w=['가위','바위','보!'];let k=0;o.style.fontSize='';
    const iv=setInterval(()=>{if(k<3){o.textContent=w[k];tone(600+k*100,.12,'triangle',.2);k++}else{clearInterval(iv);const h=rand([['✌️','가위'],['✊','바위'],['🖐','보']]);o.innerHTML=`${h[0]}<div class="mid" style="color:var(--chalk)">${h[1]}를 낸 친구 발표!</div>`;tone(988,.3,'triangle',.25)}},450);break}
  case 'doLove':{audio();const l=rand(T.loveList)||'모든 친구';$('#loveOut').innerHTML=`선생님은<br><span style="color:var(--chalk-hi)">${esc(l)}</span>를<br>사랑합니다!`;tone(880,.3,'sine',.2);break}
  case 'addLove':{const v=$('#loveIn').value.trim();if(v){T.loveList=[...T.loveList,v];store.set('love',T.loveList);drawTool()}break}
  case 'delLove':T.loveList=T.loveList.filter((_,i)=>i!==+d.i);store.set('love',T.loveList);drawTool();break;
  case 'doArrow':{const c=cur();if(!c.students.length)break;const n=5+Math.floor(Math.random()*8);$('#arOut').innerHTML=`<span style="color:var(--chalk-hi)">${esc(rand(c.students))}</span>부터 시작!<br>발표 숫자는 <span style="color:var(--chalk-hi)">${n}</span>`;tone(700,.2,'triangle',.2);break}
  case 'beatToggle':audio();T.beat.on?stopBeat():startBeat();b.textContent=T.beat.on?'멈추기':'시작';break;
  case 'beatReset':stopBeat();T.beat.b=0;T.beat.idx=0;drawTool();break;
  case 'passTalk':{const P=T.pass,list=P.phase===1?P.order:P.q0;recordTalk(list[P.i]);P.done++;P.i++;drawTool();break}
  case 'passSkip':{const P=T.pass;if(P.phase===1)P.q=[...P.q,P.order[P.i]];P.i++;drawTool();break}
  case 'passPhase':{const P=T.pass;P.phase=2;P.q0=[...P.q];P.q=[];P.i=0;drawTool();break}
  case 'passReset':T.pass=null;drawTool();break;
  case 'relayAdd':T.relay=[...T.relay,d.n];recordTalk(d.n);drawTool();break;
  case 'relayUndo':{const n=T.relay[T.relay.length-1];if(n){const c=cur();c.counts[n]=Math.max(0,(c.counts[n]||1)-1);save();T.relay=T.relay.slice(0,-1);drawTool()}break}
  case 'relayReset':T.relay=[];drawTool();break;
  case 'doGroups':{const s=shuffle(cur().students),k=Math.max(1,Math.round(s.length/T.gsize)),g=Array.from({length:k},()=>[]);s.forEach((n,i)=>g[i%k].push(n));T.groups=g;drawTool();break}
  case 'rq':R[d.k]=R[d.k]===d.v?'':d.v;renderRecommend();break;
  case 'saveClass':{const c=cur();const names=[...new Set($('#roster').value.split(/[\n,\s]+/).map(s=>s.trim()).filter(Boolean))];Object.assign(c,{name:$('#cname').value.trim()||c.name,students:names});save();render();toast('명단 저장 · '+names.length+'명');break}
  case 'newClass':{const id='c'+Date.now();classes=[...classes,{id,name:'새 반',students:[],counts:{},last:{}}];curId=id;save();render();toast('새 반을 만들었어요. 이름과 명단을 입력하세요');break}
  case 'askDelClass':if(classes.length<2){toast('반이 하나뿐이라 삭제할 수 없어요');break}confirmAct='del';renderClass();break;
  case 'delClass':classes=classes.filter(c=>c.id!==curId);curId=classes[0].id;confirmAct=null;save();render();break;
  case 'askReset':confirmAct='reset';renderClass();break;
  case 'resetCounts':{const c=cur();c.counts={};c.last={};confirmAct=null;save();renderClass();break}
  case 'noConfirm':confirmAct=null;renderClass();break;
  }});
render();
</script>
</body>
</html>
